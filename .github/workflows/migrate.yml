name: Migrate database

on:
  push:
    branches:
      - main

jobs:
  migrate:
    name: Run Drizzle migrations
    runs-on: ubuntu-latest
    environment: Production

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
